name: ERSEC 29.1.1 Reproducibility and Distribution Assurance

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  source-package-parity:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt
          python -m pip install .
      - run: python ersec.py --build-assurance . --build-assurance-base-image 'python:3.12-slim-bookworm@sha256:782412e85d0f0984994c290652577d4018aff08145c85b262bb63dc0c7522254' --build-assurance-out build-assurance-29.1.1.json
      - run: python ersec.py --roadmap-audit . --roadmap-audit-out roadmap-coverage-29.1.1.json
      - uses: actions/upload-artifact@v4
        with:
          name: ersec-29.1.1-reproducibility-evidence
          path: |
            build-assurance-29.1.1.json
            roadmap-coverage-29.1.1.json

  debian-source-build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Install Debian packaging toolchain
        run: sudo apt-get update && sudo apt-get install -y build-essential debhelper dh-python python3-all python3-setuptools devscripts fakeroot
      - name: Build source package
        run: dpkg-buildpackage -us -uc -b
      - name: Validate Debian payload
        run: |
          deb=$(ls ../ersec_29.1.1-1_all.deb)
          dpkg-deb -I "$deb"
          dpkg-deb -x "$deb" /tmp/ersec-root
          /tmp/ersec-root/usr/bin/ersec --version
          /tmp/ersec-root/usr/bin/ersec --self-test

  container:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Build digest-pinned container
        run: docker build --pull=false -t ersec:29.1.1 .
      - name: Verify container version and self-test
        run: |
          docker run --rm --network none ersec:29.1.1 --version
          docker run --rm --network none ersec:29.1.1 --self-test
      - name: Export container digest
        run: docker image inspect ersec:29.1.1 --format '{{json .RepoDigests}}' > container-digests-29.1.1.json
      - uses: actions/upload-artifact@v4
        with:
          name: ersec-29.1.1-container-evidence
          path: container-digests-29.1.1.json
