name: TestPyPI ERSEC 29.1.0

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    name: Build and validate 29.1.0 distributions
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          persist-credentials: false
      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - name: Install build tools
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements-dev.txt
      - name: Verify version
        run: |
          python - <<'PY'
          import tomllib
          with open("pyproject.toml", "rb") as f:
              version = tomllib.load(f)["project"]["version"]
          assert version == "29.1.0", version
          PY
      - name: Run self-test
        run: python ersec.py --self-test
      - name: Run pytest
        run: python -m pytest -q
      - name: Build distributions
        run: python -m build
      - name: Validate distributions
        run: python -m twine check dist/*
      - name: Store distributions
        uses: actions/upload-artifact@v5
        with:
          name: ersec-29.1.0-testpypi-distributions
          path: dist/

  publish:
    name: Publish 29.1.0 to TestPyPI
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: testpypi
      url: https://test.pypi.org/p/ersec/
    permissions:
      id-token: write
    steps:
      - name: Download validated distributions
        uses: actions/download-artifact@v6
        with:
          name: ersec-29.1.0-testpypi-distributions
          path: dist/
      - name: Publish to TestPyPI
        uses: pypa/gh-action-pypi-publish@release/v1
        with:
          repository-url: https://test.pypi.org/legacy/
