version: 29.1.0
workflows:
  - id: refund
    states: [created, approved, paid, refunded]
    transitions:
      - from: created
        to: approved
        action: approve
        allowed_roles: [reviewer]
      - from: approved
        to: paid
        action: pay
        allowed_roles: [finance]
      - from: paid
        to: refunded
        action: refund
        allowed_roles: [finance]
    invariants:
      - id: separation-of-duties
        statement: creator cannot approve own refund
        oracle:
          type: state_transition
      - id: approval-order
        statement: payment requires approved state
        oracle:
          type: state_transition
      - id: single-refund
        statement: one payment cannot be refunded twice
        oracle:
          type: state_transition
