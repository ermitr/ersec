[build-system]
requires = ["setuptools>=77", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "ersec"
version = "29.1.1"
description = "Evidence-driven application security platform with Security Behavior Graphs, contracts, control plane, and runtime Shield"
readme = "README.md"
requires-python = ">=3.11"
license = "MIT"
authors = [
  { name = "ERSEC Project" }
]
keywords = [
  "application-security", "appsec", "web-security", "api-security", "waf",
  "security-testing", "authorization", "business-logic", "devsecops", "scanner"
]
classifiers = [
  "Development Status :: 4 - Beta",
  "Environment :: Console",
  "Intended Audience :: Information Technology",
  "Intended Audience :: System Administrators",
  "Intended Audience :: Developers",
  "Operating System :: POSIX",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3 :: Only",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
  "Programming Language :: Python :: 3.14",
  "Topic :: Security",
]
dependencies = [
  "requests>=2.31,<3",
  "urllib3>=2.0,<3",
  "beautifulsoup4>=4.12,<5",
  "PyYAML>=6,<7",
  "defusedxml>=0.7.1,<1",
]

[project.optional-dependencies]
rich = ["rich>=13,<15"]
browser = ["playwright>=1.40,<2"]
llm = ["llama-cpp-python>=0.2,<1"]
dev = ["build>=1,<3", "twine>=6,<7", "pytest>=8,<10"]

[project.scripts]
ersec = "ersec.ersec_cli:main"

[project.urls]
Homepage = "https://github.com/ermitr/ersec"
Repository = "https://github.com/ermitr/ersec.git"
Documentation = "https://github.com/ermitr/ersec#readme"
Issues = "https://github.com/ermitr/ersec/issues"
Changelog = "https://github.com/ermitr/ersec/blob/main/CHANGELOG.md"
Security = "https://github.com/ermitr/ersec/security/policy"

[tool.setuptools]
packages = ["ersec"]
package-dir = {"ersec" = "src/ersec"}

[tool.pytest.ini_options]
addopts = "-ra"
testpaths = ["tests"]
